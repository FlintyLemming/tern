# Pushing a version tag (v1.2.0, v1.3.0-rc1, ...) builds the production image
# for both architectures and pushes it to GHCR under the same tag:
# ghcr.io/<owner>/tern:<tag>. A tag without a hyphen (not a pre-release) also
# moves :latest. The tern inside reports the tag as its version.
name: image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Image name and tags
        id: meta
        run: |
          tag=$GITHUB_REF_NAME
          if ! [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::git tag '$tag' is not a valid image tag (letters, digits, _ . -)"
            exit 1
          fi
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags=$image:$tag
          case $tag in
          *-*) ;;
          *) tags=$tags,$image:latest ;;
          esac
          {
            echo "tag=$tag"
            echo "image=$image"
            echo "tags=$tags"
          } >>"$GITHUB_OUTPUT"

      # Only the last Dockerfile stage runs per architecture (apk add and the
      # tool download); the web and Go stages cross-compile natively.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the pushed image on both architectures
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          WANT: tern ${{ steps.meta.outputs.tag }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            got=$(docker run --rm --pull always --platform "$platform" "$IMAGE" --version)
            echo "$platform: $got"
            if [ "$got" != "$WANT" ]; then
              echo "::error::$platform reports '$got', want '$WANT'"
              exit 1
            fi
          done
