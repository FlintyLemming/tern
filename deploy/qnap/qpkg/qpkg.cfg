# tern's QPKG configuration (QDK). @VERSION@ is filled in by the build.
QPKG_NAME="tern"
QPKG_DISPLAY_NAME="tern"
QPKG_VER="@VERSION@"
QPKG_AUTHOR="FlintyLemming"
QPKG_SUMMARY="备份与同步：用 restic 把 NAS 上的目录备份到远端，用 SFTP、rsync over SSH 或 WebDAV 单向同步文件夹。"
QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="tern.sh"
# Started and stopped like the image: tern takes up to 100 s to wind down
# runs in progress.
QPKG_TIMEOUT="60,130"

# Opens in a QTS desktop window. QTS's own web server forwards /tern to
# tern on the loopback interface (Use_Proxy, Proxy_Path), so the window
# shares QTS's origin, port and certificate.
QPKG_WEBUI="/tern/"
QPKG_WEB_PORT="17180"
QPKG_USE_PROXY="1"
QPKG_PROXY_PATH="/tern"
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1178"
QPKG_DESKTOP_APP_WIN_HEIGHT="680"
# In the main menu of administrators (without it QTS shows the app to the
# account named "admin" only).
QPKG_VISIBLE="1"

QTS_MINI_VERSION="5.0.0"
QDK_DATA_DIR_ICONS="icons"
